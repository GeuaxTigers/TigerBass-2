name: TEMP verify schematic restructure

# Temporary. Exports the controller board netlist and ERC report with
# KiCad 10 on every push to the restructure branch and posts a summary to
# its pull request, so the before and after can be compared. Removed
# before the pull request merges.

on:
  push:
    branches: [hw/restructure-controller-schematic]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Export netlist and ERC
        run: |
          kicad-cli version
          pro=$(find hardware -name '*.kicad_pro' | head -n 1)
          sch="${pro%.kicad_pro}.kicad_sch"
          kicad-cli sch export netlist --format kicadxml --output /tmp/net.xml "$sch"
          kicad-cli sch erc --format json --severity-all --output /tmp/erc.json "$sch" || true
          {
            echo "### Schematic verification for \`${GITHUB_SHA::7}\`"
            echo
            python3 tools/tmp_verify_summary.py /tmp/net.xml /tmp/erc.json
          } > /tmp/summary.md
          cat /tmp/summary.md

      - name: Post summary to the pull request
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          owner = repo.split("/")[0]
          h = {"Authorization": "Bearer " + os.environ["TOKEN"],
               "Accept": "application/vnd.github+json"}
          q = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls?head={owner}:{branch}&state=open", headers=h)
          prs = json.load(urllib.request.urlopen(q))
          if not prs:
              print("No open pull request for this branch; summary is in the log above.")
              raise SystemExit(0)
          body = open("/tmp/summary.md").read()
          r = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{prs[0]['number']}/comments",
              data=json.dumps({"body": body}).encode(), headers=h, method="POST")
          print(json.load(urllib.request.urlopen(r))["html_url"])
          EOF
