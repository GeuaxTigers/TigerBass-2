name: Hardware change
description: Work on a schematic, a board layout, a library part or a simulation.
title: "hw: "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        One person edits a given KiCad file at a time. This issue is where you claim the file: comment with the file and your branch before you start, and again when it is free.
  - type: dropdown
    id: board
    attributes:
      label: Which board
      options:
        - Controller board
        - Fret board
        - Shared library (symbols, footprints, 3D models)
        - Simulation only
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to change
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The requirement, decision record, test result or review comment behind this.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: KiCad files this will edit
      description: List each sheet or board file, so others know not to open them.
      placeholder: hardware/controller-board/adc.kicad_sch
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What will be true, and how it will be checked.
      placeholder: ERC and DRC clean. Simulation shows the buffer output stays within the ADC input range for a 0 to X mV input.
    validations:
      required: true
  - type: checkboxes
    id: affects
    attributes:
      label: Also affects
      options:
        - label: Firmware (pin or peripheral change)
        - label: Mechanical (outline, connector position or component height)
        - label: BOM or budget
