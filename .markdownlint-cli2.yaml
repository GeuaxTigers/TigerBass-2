# Markdown lint settings, used by CI and by `npx markdownlint-cli2`.
# The defaults are kept except where they fight how this repo is written.

config:
  default: true

  # Line length. Prose here is one paragraph per line, which diffs well
  # and wraps in the editor. Tables cannot be wrapped at all.
  MD013: false

  # Allow the same heading text under different parents, for example an
  # "Options" section in every decision record.
  MD024:
    siblings_only: true

  # Inline HTML. Needed for comments in the pull request template.
  MD033: false

  # First line must be a top-level heading. The pull request template
  # starts with a comment.
  MD041: false

  # Table column alignment style. Tables here are written for diffs,
  # not padded into aligned columns.
  MD060: false

globs:
  - "**/*.md"

ignores:
  - "legacy/tigerbass1/**"
  - "firmware/tests/vendor/**"
  - "node_modules/**"
  - "build/**"

# Skip anything .gitignore already excludes.
gitignore: true
